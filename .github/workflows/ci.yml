name: XianZhuan Backend CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
    paths:
      - 'xianzhuan-common/**'
      - 'xianzhuan-pojo/**'
      - 'xianzhuan-server/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'xianzhuan-common/**'
      - 'xianzhuan-pojo/**'
      - 'xianzhuan-server/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java 17 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Local Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile and Verify Dependencies
        run: |
          mvn -B clean compile --file pom.xml

      - name: Run Unit & Integration Tests
        run: |
          mvn -B test --file pom.xml

      - name: Package Backend Application
        run: |
          mvn -B package -DskipTests --file pom.xml

      - name: Archive Production JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xianzhuan-server-artifact
          path: xianzhuan-server/target/xianzhuan-server-*.jar
          retention-days: 7
          if-no-files-found: warn
