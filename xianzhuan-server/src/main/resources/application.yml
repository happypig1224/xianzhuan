server:
  port: 8081
spring:
  ai:
    dashscope:
      api-key: ${xianzhuan.ai.dashscope.api-key}
      chat:
        options:
          model: qwen-plus
          temperature: 0.3
          top-p: 0.8
          max-tokens: 1024
      embedding:
        options:
          model: text-embedding-v3
  main:
    banner-mode: off
    lazy-initialization: true
    allow-bean-definition-overriding: true
  profiles:
    active: dev
  datasource:
    driver-class-name: ${xianzhuan.datasource.driver-class-name}
    url: jdbc:mysql://${xianzhuan.datasource.host}:${xianzhuan.datasource.port}/${xianzhuan.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${xianzhuan.datasource.username}
    password: ${xianzhuan.datasource.password}
  data:
    redis:
      host: ${xianzhuan.redis.host}
      password: ${xianzhuan.redis.password}
      port: ${xianzhuan.redis.port}
      database: ${xianzhuan.redis.database}
rocketmq:
  name-server: ${xianzhuan.rocketmq.name-server}
  producer:
    group: ${xianzhuan.rocketmq.producer-group}
    send-message-timeout: 3000 # 发送消息超时时间
    # 发送消息失败重试次数，网络波动时
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2
    max-message-size: 4194304  # 最大消息大小 4MB
    compress-message-body-threshold: 4096  # 压缩阈值 4KB
    retry-another-when-broker-not-available: false
  consumer:
    group: ${xianzhuan.rocketmq.consumer-group}
    consume-thread-number: 4   # 开发环境减少消费线程
    consume-thread-max: 16     # 减少最大消费线程
    pull-batch-size: 16        # 减少批量拉取数量
    enabled: false             # 默认禁用消费者，需要时再启用

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xianzhuan.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true


xianzhuan:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 3600000 # AccessToken 1小时
    admin-refresh-ttl: 604800000 # RefreshToken 7天
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: shxy
    user-ttl: 3600000 # AccessToken 1小时
    user-refresh-ttl: 604800000 # RefreshToken 7天
    user-token-name: authentication
  wechat:
    appid: ${xianzhuan.wechat.appid}
    secret: ${xianzhuan.wechat.secret}
  tencent:
    cos:
      secret-id: ${xianzhuan.tencent.cos.secret-id}
      secret-key: ${xianzhuan.tencent.cos.secret-key}
      region: ${xianzhuan.tencent.cos.region}
      bucket-name: ${xianzhuan.tencent.cos.bucket-name}
      avatar-dir: ${xianzhuan.tencent.cos.avatar-dir}
      image-dir: ${xianzhuan.tencent.cos.image-dir}
  flash:
    sliding-window:
      window-ms: 1000
      max-requests: 5000
  # 添加以下配置
autoconfigure:
  exclude:
    - springfox.documentation.spring.web.plugins.Docket
    - springfox.documentation.spring.web.plugins.WebMvcRequestHandlerProvider

  # 在文件末尾添加 Swagger 配置
springfox:
  documentation:
    enabled: false